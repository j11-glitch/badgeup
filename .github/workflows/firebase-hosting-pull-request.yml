# Generated by the Firebase CLI (firebase init hosting:github), then adjusted:
# pinned Node 22 with npm cache. Each pull request gets a temporary preview URL.

name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Pull requests from forks have no access to the deploy secret.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BADGEUP_2D0EE }}
          projectId: badgeup-2d0ee
