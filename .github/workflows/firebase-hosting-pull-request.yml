# Generated by the Firebase CLI (firebase init hosting:github), then adjusted:
# pinned Node 22 with npm cache. Each pull request gets a temporary preview URL.

name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Pull requests from forks have no access to the deploy secret.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Firebase config secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::Set the repository secrets VITE_FIREBASE_API_KEY and VITE_FIREBASE_APP_ID (gh secret set -f .env.local)."
            exit 1
          fi
      - run: npm ci && npm run build
        env:
          # Firebase web config from repository secrets of the same name (see .env.example).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BADGEUP_2D0EE }}
          projectId: badgeup-2d0ee
