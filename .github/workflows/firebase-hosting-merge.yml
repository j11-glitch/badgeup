# Generated by the Firebase CLI (firebase init hosting:github), then adjusted:
# pinned Node 22 with npm cache, minimal permissions, one deploy at a time.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Firebase config secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::Set the repository secrets VITE_FIREBASE_API_KEY and VITE_FIREBASE_APP_ID (gh secret set -f .env.local)."
            exit 1
          fi
      - run: npm ci && npm run build
        env:
          # Firebase web config from repository secrets of the same name (see .env.example).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Shown on the page, so a deploy can be traced to its commit.
          VITE_COMMIT_SHA: ${{ github.sha }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BADGEUP_2D0EE }}
          channelId: live
          projectId: badgeup-2d0ee
